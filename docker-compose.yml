services:
  portugal-di:
    build: .
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    env_file:
      # Optional: copy .env.example to .env to set OPENAI_API_KEY etc.
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
