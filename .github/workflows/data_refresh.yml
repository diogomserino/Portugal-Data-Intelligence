name: Weekly Data Refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (fetch + transform + load + analysis + report)
        run: python main.py --mode full
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit refreshed charts and HTML report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only tracked outputs change on a refresh: the chart PNGs and the
          # published HTML report. Processed CSVs / the SQLite DB are gitignored,
          # so staging them here would be a silent no-op.
          git add reports/powerbi/charts docs/index.html || true
          git diff --staged --quiet || git commit -m "data: weekly refresh $(date +%Y-%m-%d)"
          git push
