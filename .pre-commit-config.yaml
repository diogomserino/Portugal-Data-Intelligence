# Pre-commit hooks — mirror the CI lint stack in .github/workflows/ci.yml.
#
#   pip install pre-commit && pre-commit install   # one-time setup
#   pre-commit run --all-files                     # run against the whole repo
#
# mypy stays CI-only: it needs the full dependency set installed to type-check
# cleanly, which would make local commits slow.

# Skip generated artefacts and the committed data snapshot.
exclude: |
  (?x)^(
    docs/index\.html|
    docs/index\.pt\.html|
    data/.*|
    reports/.*|
    .*\.ipynb
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length", "100"]
        files: ^(src|config|tests)/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "100"]
        files: ^(src|config|tests)/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--extend-ignore=E501,W503,F401,F541,F841,E402,E203"
        files: ^(src|config)/
